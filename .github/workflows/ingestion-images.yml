name: Build ingestion service images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/**", "frontend/**", "compose*.yaml", ".github/workflows/ingestion-images.yml"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [upload-api, airflow, ingestion, minio, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: printf 'name=ghcr.io/%s/%s\n' "${GITHUB_REPOSITORY,,}" "$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
