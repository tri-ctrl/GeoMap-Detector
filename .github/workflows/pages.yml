# Builds the in-browser detection models (ONNX) and publishes the portal to GitHub Pages.
# The published portal runs entirely in the visitor's browser: Wayback imagery, AOI clipping,
# YOLO-OBB detection (WebGPU / WebAssembly), annotation and zip export.
name: Publish portal to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Test browser UI and model regressions
        run: node --test tests/*.test.cjs
      - name: Test native IndexedDB recovery and exports in Chromium
        run: node tests/browser/persistence.cjs --lifecycle
      - name: Test native allocation limits and georeferenced pixels in Chromium
        run: node tests/browser/allocation.cjs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Test model asset checks (no ML dependencies)
        run: python -m unittest discover -s tests -p 'test_model_assets.py' -v
      - name: Cache exported models
        id: models
        uses: actions/cache@v4
        with:
          path: frontend/models
          key: onnx-yolo11-obb-1024-v1-${{ hashFiles('scripts/export_onnx.py') }}
      - name: Export YOLO OBB models to ONNX
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet ultralytics onnx onnxslim
          python scripts/export_onnx.py
      # Always validate, including cache hits that skip the export and ML install.
      - name: Verify exported or cached model files before publishing
        run: python scripts/export_onnx.py --check
      - name: Upload models for local use
        uses: actions/upload-artifact@v4
        with:
          name: browser-models
          path: frontend/models
          if-no-files-found: error
      - name: Configure Pages (requires Source set to GitHub Actions)
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published source and model URLs
        env:
          GMD_DEPLOYMENT_URL: ${{ steps.deploy.outputs.page_url }}
          GMD_DEPLOYMENT_REVISION: ${{ github.sha }}
        run: node scripts/check_deployment.cjs --url "$GMD_DEPLOYMENT_URL" --revision "$GMD_DEPLOYMENT_REVISION"
