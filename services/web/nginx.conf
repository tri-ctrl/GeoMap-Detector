server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_backend http://upload-api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    # Preserve the signed path, query and public Host header. No /storage prefix
    # is added: changing any of these would invalidate an S3 signature.
    location /geomap-files/ {
        set $s3_backend http://minio:9000;
        proxy_pass $s3_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host ${S3_PROXY_HOST};
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 0;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
